        '200':
          description: Local tree.
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  commit_id: {type: string}
                  height: {type: integer, format: int64, minimum: 0}
                  created_at: {type: integer, format: int64}
                  entries:
                    type: array
                    items:
                      type: object
                      required: [path, type, size]
                      properties:
                        path: {type: string}
                        type: {$ref: '#/components/schemas/RemoteTreeEntryType'}
                        size: {type: integer, format: int64, minimum: 0}
