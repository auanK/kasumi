openapi: 3.1.0
info: {title: Kasumi daemon HTTP API, version: 1.0.0, description: The daemon validates Host against the local address,
    configured allowed_hosts (including *.domain wildcards), direct IP literals on wildcard binds, or explicit
    skip_host_check. Browser mutations require a matching Origin or Referer and JSON for requests with a body. Browser
    session cookies and IPC tokens are accepted on their respective listeners. Registered GET routes also accept HEAD
    through the HTTP server.}
servers:
- {url: 'http://127.0.0.1:3137', description: Default Web API listener.}
- url: http://127.0.0.1:{ipc_port}
  description: Local IPC listener discovered via daemon.control.json.
  variables:
    ipc_port: {default: '3137', description: Use the current dynamically assigned IPC port.}
security:
- browserSession: []
- ipcToken: []
tags:
- {name: Authentication}
- {name: Daemon}
- {name: Profiles}
- {name: Diagnostics}
- {name: Remote explorer}
- {name: Conflicts}
- {name: Jobs}
paths:
  /v1/auth/status:
    get:
      operationId: getAuthStatus
      tags: [Authentication]
      summary: Read password setup and session state
      security:
      - {}
      - browserSession: []
      - ipcToken: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthStatus'}
        '403': {$ref: '#/components/responses/Forbidden'}
        default: {$ref: '#/components/responses/Error'}
  /v1/auth/login:
    post:
      operationId: login
      tags: [Authentication]
      summary: Create a browser session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username: {$ref: '#/components/schemas/WebUsername'}
                password: {type: string, format: password}
              required: [username, password]
      responses:
        '200':
          description: Session created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LoginSession'}
          headers:
            Set-Cookie:
              description: Session cookie or expiration directive.
              schema: {type: string}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '415': {$ref: '#/components/responses/UnsupportedMedia'}
        '429': {$ref: '#/components/responses/Throttled'}
        '503': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /v1/auth/logout:
    post:
      operationId: logout
      tags: [Authentication]
      summary: Revoke the current session
      security:
      - browserSession: []
        csrfToken: []
      - ipcToken: []
      responses:
        '200':
          description: Cookie expired.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LogoutResponse'}
          headers:
            Set-Cookie:
              description: Session cookie or expiration directive.
              schema: {type: string}
        '403': {$ref: '#/components/responses/Forbidden'}
        '415': {$ref: '#/components/responses/UnsupportedMedia'}
        default: {$ref: '#/components/responses/Error'}
  /v1/auth/password:
    post:
      operationId: setPassword
      tags: [Authentication]
      summary: Create or rotate the Web API password
      description: Initial setup uses the single-use token in web-bootstrap.token. Rotation requires an active session,
        its CSRF token and the current password. Browser requests always supply a matching Origin or Referer.
      security:
      - browserSession: []
        csrfToken: []
      - ipcToken: []
      - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - {$ref: '#/components/schemas/BootstrapPassword'}
              - {$ref: '#/components/schemas/RotatePassword'}
      responses:
        '200':
          description: Password stored and all sessions revoked.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SetPasswordResponse'}
          headers:
            Set-Cookie:
              description: Session cookie or expiration directive.
              schema: {type: string}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '415': {$ref: '#/components/responses/UnsupportedMedia'}
        '429': {$ref: '#/components/responses/Throttled'}
        '500': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /v1/auth/username:
    post:
      operationId: changeUsername
      tags: [Authentication]
      summary: Update the Web API login username without revoking the current session
      security:
      - browserSession: []
        csrfToken: []
      - ipcToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChangeUsernameRequest'}
      responses:
        '200':
          description: Username updated while keeping active sessions valid.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChangeUsernameResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '415': {$ref: '#/components/responses/UnsupportedMedia'}
        '429': {$ref: '#/components/responses/Throttled'}
        '500': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /v1/status:
    get:
      operationId: getStatus
      tags: [Daemon]
      summary: Read daemon and profile status
      parameters:
      - name: profile
        in: query
        required: false
        description: Filter by profile name.
        schema: {type: string, pattern: '^[A-Za-z0-9_-]+$'}
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DaemonStatus'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Error'}
  /v1/events:
    get:
      operationId: getEvents
      tags: [Daemon]
      summary: Read sequenced daemon events
      parameters:
      - name: profile
        in: query
        required: false
        description: Filter by profile name.
        schema: {type: string, pattern: '^[A-Za-z0-9_-]+$'}
      - name: since
        in: query
        required: false
        description: Return events after this sequence number.
        schema: {type: integer, format: int64, minimum: 0}
      - name: limit
        in: query
        required: false
        description: Maximum number of returned events. Zero selects the default, and values above 1000 are capped.
        schema: {type: integer, format: int64, minimum: 0}
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EventHistory'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        default: {$ref: '#/components/responses/Error'}
  /v1/logs:
    get:
      operationId: getLogs
      tags: [Daemon]
      summary: Read daemon log history
      parameters:
      - name: profile
        in: query
        required: false
        description: Filter by profile name.
        schema: {type: string, pattern: '^[A-Za-z0-9_-]+$'}
      - name: lines
        in: query
        required: false
        description: Number of log entries, clamped to 1–1000.
        schema:
          type: integer
          format: int64
          minimum: 0
          default: 100
      - name: full
        in: query
        required: false
        description: Include the detail field.
        schema: {type: boolean, default: true}
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LogHistory'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /v1/events/stream:
    get:
      operationId: streamEvents
      tags: [Daemon]
      summary: Subscribe to status, jobs and log events
      description: Server-Sent Events with JSON in each data field. Named log events carry id equal to seq. Named
        status events contain profile progress and job snapshots. Reconnect using Last-Event-ID to recover available
        entries from the live ring. The server closes the stream when its session expires or is revoked.
      parameters:
      - name: since
        in: query
        required: false
        description: Return events after this sequence number.
        schema: {type: integer, format: int64, minimum: 0}
      - name: Last-Event-ID
        in: header
        required: false
        description: Last received log sequence. Takes precedence over since.
        schema: {type: integer, format: int64, minimum: 0}
      responses:
        '200':
          description: SSE stream.
          content:
            text/event-stream:
              schema: {type: string}
          headers:
            X-Accel-Buffering:
              description: Disable proxy buffering.
              schema: {const: 'no'}
          x-event-schemas:
            log: {$ref: '#/components/schemas/DaemonEvent'}
            status: {$ref: '#/components/schemas/StreamStatus'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/Throttled'}
        default: {$ref: '#/components/responses/Error'}
  /v1/sync:
    post:
      operationId: triggerSync
      tags: [Daemon]
      summary: Trigger the normal daemon synchronization
      description: Omit profile to trigger all eligible profiles. Use the maintenance sync job to pass advanced
        CLI options.
      security:
      - browserSession: []
        csrfToken: []
      - ipcToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                profile: {type: string, pattern: '^[A-Za-z0-9_-]+$'}
                wait: {type: boolean, default: false}
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SyncTriggered'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '415': {$ref: '#/components/responses/UnsupportedMedia'}
        default: {$ref: '#/components/responses/Error'}
  /v1/autostart:
    post:
      operationId: setAutostart
      tags: [Daemon]
      summary: Enable or disable login-session autostart
      description: Updates the current user's platform autostart setting and refreshes the daemon status.
      security:
      - browserSession: []
        csrfToken: []
      - ipcToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: {type: boolean}
              required: [enabled]
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DaemonAutostartStatus'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '415': {$ref: '#/components/responses/UnsupportedMedia'}
        '500': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /v1/pause:
    post:
      operationId: pauseProfile
      tags: [Daemon]
      summary: Pause a daemon profile
      security:
      - browserSession: []
        csrfToken: []
      - ipcToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                profile: {type: string, pattern: '^[A-Za-z0-9_-]+$'}
              required: [profile]
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {const: true}
                required: [ok]
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '415': {$ref: '#/components/responses/UnsupportedMedia'}
        default: {$ref: '#/components/responses/Error'}
  /v1/resume:
    post:
      operationId: resumeProfile
      tags: [Daemon]
      summary: Resume a daemon profile
      security:
      - browserSession: []
        csrfToken: []
      - ipcToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                profile: {type: string, pattern: '^[A-Za-z0-9_-]+$'}
              required: [profile]
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {const: true}
                required: [ok]
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '415': {$ref: '#/components/responses/UnsupportedMedia'}
        default: {$ref: '#/components/responses/Error'}
  /v1/lock:
    post:
      operationId: lockProfile
      tags: [Daemon]
      summary: Lock a daemon profile
      security:
      - browserSession: []
        csrfToken: []
      - ipcToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                profile: {type: string, pattern: '^[A-Za-z0-9_-]+$'}
              required: [profile]
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {const: true}
                required: [ok]
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '415': {$ref: '#/components/responses/UnsupportedMedia'}
        default: {$ref: '#/components/responses/Error'}
  /v1/cancel:
    post:
      operationId: cancelProfile
      tags: [Daemon]
      summary: Cancel work on a daemon profile
      security:
      - browserSession: []
        csrfToken: []
      - ipcToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                profile: {type: string, pattern: '^[A-Za-z0-9_-]+$'}
              required: [profile]
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {const: true}
                required: [ok]
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '415': {$ref: '#/components/responses/UnsupportedMedia'}
        default: {$ref: '#/components/responses/Error'}
  /v1/unlock:
    post:
      operationId: unlockProfile
      tags: [Daemon]
      summary: Unlock a daemon memory profile
      description: Browser authentication uses profile credentials in the body. IPC authentication uses the daemon's
        sealed key format.
      security:
      - browserSession: []
        csrfToken: []
      - ipcToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - {$ref: '#/components/schemas/BrowserUnlock'}
              - {$ref: '#/components/schemas/IpcUnlock'}
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  unlocked: {const: true}
                required: [unlocked]
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '415': {$ref: '#/components/responses/UnsupportedMedia'}
        default: {$ref: '#/components/responses/Error'}
  /v1/reload:
    post:
      operationId: reloadDaemon
      tags: [Daemon]
      summary: Reload daemon configuration
      security:
      - browserSession: []
        csrfToken: []
      - ipcToken: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  reloaded: {const: true}
                required: [reloaded]
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '415': {$ref: '#/components/responses/UnsupportedMedia'}
        default: {$ref: '#/components/responses/Error'}
  /v1/stop:
    post:
      operationId: stopDaemon
      tags: [Daemon]
      summary: Stop the daemon
      security:
      - browserSession: []
        csrfToken: []
      - ipcToken: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  stopping: {const: true}
                required: [stopping]
        '403': {$ref: '#/components/responses/Forbidden'}
        '415': {$ref: '#/components/responses/UnsupportedMedia'}
        default: {$ref: '#/components/responses/Error'}
  /v1/web/config:
    get:
      operationId: getWebConfig
      tags: [Daemon]
      summary: Read Web UI network listener configuration
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebConfig'}
        '403': {$ref: '#/components/responses/Forbidden'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      operationId: updateWebConfig
      tags: [Daemon]
      summary: Update Web UI network listener configuration in web.json
      security:
      - browserSession: []
        csrfToken: []
      - ipcToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WebConfigPatch'}
      responses:
        '200':
          description: Listener configuration saved; daemon restart required to rebind.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebConfigUpdateResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '415': {$ref: '#/components/responses/UnsupportedMedia'}
        '500': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /v1/diagnostics:
    get:
      operationId: getDiagnostics
      tags: [Diagnostics]
      summary: Read host and profile diagnostics
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DiagnosticsReport'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /v1/diagnostics/{profile}:
    parameters:
    - name: profile
      in: path
      required: true
      description: Profile name.
      schema: {type: string, pattern: '^[A-Za-z0-9_-]+$'}
    get:
      operationId: getProfileDiagnostics
      tags: [Diagnostics]
      summary: Read diagnostics for a selected profile
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DiagnosticsReport'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /v1/rclone/remotes:
    get:
      operationId: listRcloneRemotes
      tags: [Diagnostics]
      summary: List configured rclone remotes
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RcloneRemotesInfo'}
        '403': {$ref: '#/components/responses/Forbidden'}
        default: {$ref: '#/components/responses/Error'}
  /v1/profiles:
    get:
      operationId: listProfiles
      tags: [Profiles]
      summary: List profile configuration and status
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Profiles'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createProfile
      tags: [Profiles]
      summary: Create a profile
      description: Use verify to authenticate the remote with these credentials before saving the profile.
      security:
      - browserSession: []
        csrfToken: []
      - ipcToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateProfile'}
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Profile'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '415': {$ref: '#/components/responses/UnsupportedMedia'}
        '500': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /v1/profiles/{name}:
    parameters:
    - name: name
      in: path
      required: true
      description: Profile name.
      schema: {type: string, pattern: '^[A-Za-z0-9_-]+$'}
    get:
      operationId: getProfile
      tags: [Profiles]
      summary: Read profile configuration, activity and status
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProfileDetails'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      operationId: updateProfile
      tags: [Profiles]
      summary: Update profile configuration
      security:
      - browserSession: []
        csrfToken: []
      - ipcToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProfilePatch'}
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Profile'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '415': {$ref: '#/components/responses/UnsupportedMedia'}
        '500': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteProfile
      tags: [Profiles]
      summary: Remove a profile and preserve its files
      security:
      - browserSession: []
        csrfToken: []
      - ipcToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                confirm: {const: true}
              required: [confirm]
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: {const: true}
                required: [deleted]
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '415': {$ref: '#/components/responses/UnsupportedMedia'}
        '500': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /v1/profiles/{name}/clone:
    parameters:
    - name: name
      in: path
      required: true
      description: Profile name.
      schema: {type: string, pattern: '^[A-Za-z0-9_-]+$'}
    post:
      operationId: cloneProfile
      tags: [Profiles]
      summary: Clone a profile
      security:
      - browserSession: []
        csrfToken: []
      - ipcToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string, pattern: '^[A-Za-z0-9_-]+$'}
              required: [name]
      responses:
        '200':
