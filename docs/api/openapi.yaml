      in: path
      required: true
      schema: {type: string, pattern: '^[A-Za-z0-9_-]+$'}
    get:
      operationId: readLocalFile
      tags: [Remote explorer]
      summary: Stream a file from the profile's local folder
      description: Streams current disk contents for a mapped file. The path must be present in the saved local map. Symlinks and reparse points are skipped. PDF responses declare inline disposition.
      parameters:
      - name: path
        in: query
        required: true
        schema: {type: string, minLength: 1}
      - name: Range
        in: header
        description: A single bytes range, explicit, open-ended or suffix.
        schema: {type: string}
      responses:
        '200':
          description: Complete file with its media type.
          headers:
            Accept-Ranges: {schema: {const: bytes}}
          content:
            '*/*':
              schema: {type: string, format: binary}
        '206':
          description: Requested byte range with the file's media type.
          headers:
            Accept-Ranges: {schema: {const: bytes}}
            Content-Range: {schema: {type: string}}
          content:
            '*/*':
              schema: {type: string, format: binary}
        '416':
          description: Unsatisfiable range.
          headers:
            Content-Range: {schema: {type: string}}
        default: {$ref: '#/components/responses/Error'}
  /v1/remote/{profile}/download:
    parameters:
    - name: profile
      in: path
      required: true
      description: Profile name.
      schema: {type: string, pattern: '^[A-Za-z0-9_-]+$'}
    get:
      operationId: downloadRemotePath
      tags: [Remote explorer]
      summary: Download an authenticated file or range
      description: Streams large chunked files in verified windows. PDF responses declare inline disposition.
      parameters:
      - name: path
        in: query
        required: true
        description: URL-encoded logical path.
        schema: {type: string, minLength: 1}
      - name: commit
        in: query
        required: false
        description: Select an authenticated commit.
        schema: {type: string, pattern: '^[a-f0-9]{64}$'}
      - name: Range
        in: header
        required: false
        description: A single bytes range. Supports explicit, open-ended and suffix ranges.
        schema: {type: string}
      responses:
        '200':
          description: Complete file.
          headers:
            Accept-Ranges:
              description: Supported range unit.
              schema: {const: bytes}
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
            application/pdf:
              schema: {type: string, format: binary}
            text/plain:
              schema: {type: string, format: binary}
            image/png:
              schema: {type: string, format: binary}
            image/jpeg:
              schema: {type: string, format: binary}
            image/webp:
              schema: {type: string, format: binary}
            image/gif:
              schema: {type: string, format: binary}
            video/mp4:
              schema: {type: string, format: binary}
            video/webm:
              schema: {type: string, format: binary}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
        '206':
          description: Authenticated byte range.
          headers:
            Accept-Ranges:
              description: Supported range unit.
              schema: {const: bytes}
            Content-Range:
              description: Byte interval and the resource length.
              schema: {type: string}
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
            application/pdf:
              schema: {type: string, format: binary}
            text/plain:
              schema: {type: string, format: binary}
            image/png:
              schema: {type: string, format: binary}
            image/jpeg:
              schema: {type: string, format: binary}
            image/webp:
              schema: {type: string, format: binary}
            image/gif:
              schema: {type: string, format: binary}
            video/mp4:
              schema: {type: string, format: binary}
            video/webm:
              schema: {type: string, format: binary}
        '416':
          description: Unsatisfiable range or multiple ranges.
          headers:
            Content-Range:
              description: Byte interval and the resource length.
              schema: {type: string}
  /v1/remote/{profile}/restore:
    parameters:
    - name: profile
      in: path
      required: true
      description: Profile name.
      schema: {type: string, pattern: '^[A-Za-z0-9_-]+$'}
    post:
      operationId: restoreRemoteTree
      tags: [Remote explorer]
      summary: Restore a file or subtree
      security:
      - browserSession: []
        csrfToken: []
      - ipcToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                dst: {type: string, minLength: 1}
                commit: {type: string, pattern: '^[a-f0-9]{64}$'}
                prefix: {type: string}
                dry_run: {type: boolean, default: true}
              required: [dst]
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RemoteRestoreReport'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '415': {$ref: '#/components/responses/UnsupportedMedia'}
        '422': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /v1/conflicts/{profile}:
    parameters:
    - name: profile
      in: path
      required: true
      description: Profile name.
      schema: {type: string, pattern: '^[A-Za-z0-9_-]+$'}
    get:
      operationId: listConflicts
      tags: [Conflicts]
      summary: List conflict groups and preserved artifacts
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LocalConflictsReport'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Error'}
  /v1/conflicts/{profile}/diff:
    parameters:
    - name: profile
      in: path
      required: true
      description: Profile name.
      schema: {type: string, pattern: '^[A-Za-z0-9_-]+$'}
    get:
      operationId: previewConflict
      tags: [Conflicts]
      summary: Read both sides of a conflict
      description: Each present file contributes up to 1 MiB, encoded as hexadecimal. A missing canonical side is
        null.
      parameters:
      - name: path
        in: query
        required: true
        description: URL-encoded logical path.
        schema: {type: string, minLength: 1}
      - name: artifact
        in: query
        required: true
        description: Full logical path of an artifact returned for this group.
        schema: {type: string, minLength: 1}
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConflictPreview'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        default: {$ref: '#/components/responses/Error'}
  /v1/conflicts/{profile}/resolve:
    parameters:
    - name: profile
      in: path
      required: true
      description: Profile name.
      schema: {type: string, pattern: '^[A-Za-z0-9_-]+$'}
    post:
      operationId: resolveConflict
      tags: [Conflicts]
      summary: Resolve or preview one conflict
      security:
      - browserSession: []
        csrfToken: []
      - ipcToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                path: {type: string, minLength: 1}
                choice: {$ref: '#/components/schemas/ConflictResolutionChoice'}
                artifact: {type: string, minLength: 1}
                dry_run: {type: boolean, default: false}
              required: [path, choice]
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResolveConflictReport'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '415': {$ref: '#/components/responses/UnsupportedMedia'}
        default: {$ref: '#/components/responses/Error'}
  /v1/jobs/{id}:
    parameters:
    - name: id
      in: path
      required: true
      description: Daemon job ID.
      schema: {type: integer, format: int64, minimum: 0}
    get:
      operationId: getJob
      tags: [Jobs]
      summary: Read job progress and result
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Job'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Error'}
  /v1/maintenance/{profile}/fsck:
    parameters:
    - name: profile
      in: path
      required: true
      description: Profile name.
      schema: {type: string, pattern: '^[A-Za-z0-9_-]+$'}
    post:
      operationId: queueFsck
      tags: [Jobs]
      summary: Queue the integrity check
      security:
      - browserSession: []
        csrfToken: []
      - ipcToken: []
      responses:
        '202': {$ref: '#/components/responses/Accepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '415': {$ref: '#/components/responses/UnsupportedMedia'}
        '429': {$ref: '#/components/responses/Throttled'}
        default: {$ref: '#/components/responses/Error'}
  /v1/maintenance/{profile}/gc:
    parameters:
    - name: profile
      in: path
      required: true
      description: Profile name.
      schema: {type: string, pattern: '^[A-Za-z0-9_-]+$'}
    post:
      operationId: queueGarbageCollection
      tags: [Jobs]
      summary: Queue garbage collection
      security:
      - browserSession: []
        csrfToken: []
      - ipcToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                dry_run: {type: boolean, default: true}
                confirm: {type: boolean, default: false}
                min_age_hours:
                  type: integer
                  format: int64
                  minimum: 0
                  maximum: 8760
              if:
                required: [dry_run]
                properties:
                  dry_run: {const: false}
              then:
                required: [confirm]
                properties:
                  confirm: {const: true}
      responses:
        '202': {$ref: '#/components/responses/Accepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '415': {$ref: '#/components/responses/UnsupportedMedia'}
        '429': {$ref: '#/components/responses/Throttled'}
        default: {$ref: '#/components/responses/Error'}
  /v1/maintenance/{profile}/repack:
    parameters:
    - name: profile
      in: path
      required: true
      description: Profile name.
      schema: {type: string, pattern: '^[A-Za-z0-9_-]+$'}
    post:
      operationId: queueRepack
      tags: [Jobs]
      summary: Queue pack consolidation
      security:
      - browserSession: []
        csrfToken: []
      - ipcToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                dry_run: {type: boolean, default: true}
                confirm: {type: boolean, default: false}
                reclaim_dirty: {type: boolean, default: false}
              if:
                required: [dry_run]
                properties:
                  dry_run: {const: false}
              then:
                required: [confirm]
                properties:
                  confirm: {const: true}
      responses:
        '202': {$ref: '#/components/responses/Accepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '415': {$ref: '#/components/responses/UnsupportedMedia'}
        '429': {$ref: '#/components/responses/Throttled'}
        default: {$ref: '#/components/responses/Error'}
  /v1/maintenance/{profile}/resolve-missing:
    parameters:
    - name: profile
      in: path
      required: true
      description: Profile name.
      schema: {type: string, pattern: '^[A-Za-z0-9_-]+$'}
    post:
      operationId: queueResolveMissing
      tags: [Jobs]
      summary: Queue pending-content resolution
      security:
      - browserSession: []
        csrfToken: []
      - ipcToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                dry_run: {type: boolean, default: true}
                confirm: {type: boolean, default: false}
              if:
                required: [dry_run]
                properties:
                  dry_run: {const: false}
              then:
                required: [confirm]
                properties:
                  confirm: {const: true}
      responses:
        '202': {$ref: '#/components/responses/Accepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '415': {$ref: '#/components/responses/UnsupportedMedia'}
        '429': {$ref: '#/components/responses/Throttled'}
        default: {$ref: '#/components/responses/Error'}
  /v1/maintenance/{profile}/sync:
    parameters:
    - name: profile
      in: path
      required: true
      description: Profile name.
      schema: {type: string, pattern: '^[A-Za-z0-9_-]+$'}
    post:
      operationId: queueAdvancedSync
      tags: [Jobs]
      summary: Queue synchronization using advanced CLI options
      description: Options are passed to the application sync request. Semantic validation failures are reported
        in the job result. An inventory-audit failure after a successful sync carries the sync result so clients
        can distinguish it from a failed sync.
      security:
      - browserSession: []
        csrfToken: []
      - ipcToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdvancedSync'}
      responses:
        '202': {$ref: '#/components/responses/Accepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '415': {$ref: '#/components/responses/UnsupportedMedia'}
        '429': {$ref: '#/components/responses/Throttled'}
        default: {$ref: '#/components/responses/Error'}
  /v1/maintenance/{profile}/remove-writer:
    parameters:
    - name: profile
      in: path
      required: true
      description: Profile name.
      schema: {type: string, pattern: '^[A-Za-z0-9_-]+$'}
    post:
      operationId: queueRemoveWriter
      tags: [Jobs]
      summary: Queue removal of the selected writer marker
      security:
      - browserSession: []
        csrfToken: []
      - ipcToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                writer_id: {type: string, minLength: 1}
              required: [writer_id]
      responses:
        '202': {$ref: '#/components/responses/Accepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '415': {$ref: '#/components/responses/UnsupportedMedia'}
        '429': {$ref: '#/components/responses/Throttled'}
        default: {$ref: '#/components/responses/Error'}
  /v1/maintenance/{profile}/remove-barrier:
    parameters:
    - name: profile
      in: path
      required: true
      description: Profile name.
      schema: {type: string, pattern: '^[A-Za-z0-9_-]+$'}
    post:
      operationId: queueRemoveBarrier
      tags: [Jobs]
      summary: Queue removal of an abandoned maintenance barrier
      description: Explicit confirmation is required. When no barrier ID is supplied, the application selects the
        single eligible barrier or fails if selection is ambiguous.
      security:
      - browserSession: []
        csrfToken: []
      - ipcToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                barrier_id: {type: string, minLength: 1}
                confirm_abandoned: {const: true}
              required: [confirm_abandoned]
      responses:
        '202': {$ref: '#/components/responses/Accepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '415': {$ref: '#/components/responses/UnsupportedMedia'}
        '429': {$ref: '#/components/responses/Throttled'}
        default: {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    browserSession:
      type: apiKey
      in: cookie
      name: kasumi_session
      description: HttpOnly, SameSite=Strict and Secure via a trusted loopback HTTPS proxy. Sessions expire after
        a 30 minute idle timeout or 12 hours total.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Session-bound token from login or auth status. Browser mutations also require a same-origin Origin
        or Referer.
    ipcToken:
      type: apiKey
      in: header
      name: X-Kasumi-Daemon-Token
      description: Local CLI token from daemon.control.json, accepted on the loopback IPC listener. Browser Origin,
        Referer and fetch metadata headers are forbidden for this scheme.
  responses:
    Error:
      description: API error. HTTP parser errors may have an empty or plain-text body.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
        text/plain:
          schema: {type: string}
    BadRequest:
      description: Invalid request, selector, field or confirmation.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Forbidden:
      description: Invalid credentials, Host, browser origin, or CSRF token.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: Requested profile, job, path, commit or object was not found.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Conflict:
      description: Concurrent operation, stale state or an ambiguous revision selector.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    UnsupportedMedia:
      description: A mutation body requires application/json.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Throttled:
      description: Login backoff or job or stream capacity reached.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
      headers:
        Retry-After:
          description: Retry delay in seconds for authentication backoff, when present.
          schema: {type: integer, format: int64, minimum: 0}
    Accepted:
      description: Job accepted. Use the Location header or the SSE status events to follow it.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/JobSnapshot'}
      headers:
        Location:
          description: Relative URL of the job resource.
          schema: {type: string}
      links:
        job:
          operationId: getJob
          parameters: {id: $response.body#/id}
  schemas:
    Activity:
      type: string
      enum: [scanning, staging, uploading, downloading, verifying, installing, reobserving, listing, authenticating,
        auditing, removing, comparing_snapshots, checking_remote_content, preparing_plan, preparing_remote, checking_controls,
        establishing_barrier, probing_consistency, analyzing_reachability, loading_activities, releasing_barrier]
    ActivityProgress:
      type: object
      properties:
        activity: {$ref: '#/components/schemas/Activity'}
        bytes: {type: integer, format: int64, minimum: 0}
        total_bytes:
          anyOf:
          - {type: integer, format: int64, minimum: 0}
          - {type: 'null'}
        objects: {type: integer, format: int64, minimum: 0}
        total_objects:
          anyOf:
          - {type: integer, format: int64, minimum: 0}
          - {type: 'null'}
        cache_hits: {type: integer, format: int64, minimum: 0}
        files_hashed: {type: integer, format: int64, minimum: 0}
        bytes_reused: {type: integer, format: int64, minimum: 0}
        staged_bytes:
          anyOf:
          - {type: integer, format: int64, minimum: 0}
          - {type: 'null'}
        attempt: {type: integer, format: int64, minimum: 0}
        observing_remote: {type: boolean}
        stage_id: {type: integer, format: int64, minimum: 0}
        item_path: {type: string}
        item_bytes:
          anyOf:
          - {type: integer, format: int64, minimum: 0}
          - {type: 'null'}
        item_total_bytes:
          anyOf:
          - {type: integer, format: int64, minimum: 0}
          - {type: 'null'}
      required: [activity, bytes, total_bytes, objects, total_objects, cache_hits, files_hashed, bytes_reused, staged_bytes,
        attempt, observing_remote, stage_id, item_path, item_bytes, item_total_bytes]
    AdvancedSync:
      type: object
      properties:
        initial: {type: boolean, default: false, description: Perform initial sync. The profile must have no existing
            local database or transaction evidence.}
        repair: {type: boolean, default: false, description: Repair missing remote content using recoverable sources.}
        audit_inventory: {type: boolean, default: false, description: Report authenticated inventory after sync.}
        allow_empty_local: {type: boolean, default: false, description: Allow sync to proceed when an unexpectedly
            empty local tree would otherwise block it.}
        bandwidth_limit:
          type: string
          minLength: 1
          examples: [8M]
          description: Override the profile rclone bandwidth setting for this run.
        transfer_concurrency:
          type: integer
          minimum: 1
          maximum: 16
          description: Override the profile content transfer concurrency for this run.
      allOf:
      - if:
          properties:
            initial: {const: true}
          required: [initial]
        then:
          not:
            properties:
              repair: {const: true}
            required: [repair]
      - if:
          properties:
            initial: {const: true}
          required: [initial]
        then:
          not:
            properties:
              audit_inventory: {const: true}
            required: [audit_inventory]
      - if:
          properties:
            initial: {const: true}
          required: [initial]
        then:
          not:
            properties:
              allow_empty_local: {const: true}
            required: [allow_empty_local]
      - if:
          properties:
            repair: {const: true}
          required: [repair]
        then:
          not:
            properties:
              allow_empty_local: {const: true}
            required: [allow_empty_local]
    AuthStatus:
      type: object
      properties:
        authenticated: {type: boolean}
        configured: {type: boolean}
        csrf_token: {type: string, pattern: '^[A-Fa-f0-9]{64}$'}
        username: {$ref: '#/components/schemas/WebUsername'}
      required: [authenticated, configured]
    BarrierRemovalMutationState:
      type: string
      enum: [not_attempted, confirmed, uncertain]
    BarrierRemovalOutcome:
      type: string
      enum: [removed, already_absent]
    BarrierRemovalStage:
      type: string
      enum: [checking_presence, downloading_payload, validating_payload, checking_writers, verifying_physical_identity,
        removing, confirming_absence]
    BootstrapPassword:
      type: object
      properties:
        bootstrap_token: {type: string, pattern: '^[A-Fa-f0-9]{64}$'}
        username: {$ref: '#/components/schemas/WebUsername'}
        password: {$ref: '#/components/schemas/WebPassword'}
      required: [bootstrap_token, password]
    BrowserUnlock:
      allOf:
      - {$ref: '#/components/schemas/ProfileCredentials'}
      - type: object
        properties:
          profile: {type: string, pattern: '^[A-Za-z0-9_-]+$'}
        required: [profile]
    ChangeUsernameRequest:
      type: object
      properties:
        current_password: {type: string, format: password}
        username: {$ref: '#/components/schemas/WebUsername'}
      required: [current_password, username]
    ChangeUsernameResponse:
      type: object
      properties:
        username: {$ref: '#/components/schemas/WebUsername'}
      required: [username]
    ConflictOrigin:
      type: string
      enum: [local, remote, branch_commit]
    ConflictPreview:
      type: object
      properties:
        canonical:
          anyOf:
          - {$ref: '#/components/schemas/FilePreview'}
          - {type: 'null'}
        artifact: {$ref: '#/components/schemas/FilePreview'}
      required: [canonical, artifact]
    ConflictResolutionChoice:
      type: string
      enum: [keep_canonical, keep_artifact]
    CreateProfile:
      allOf:
      - {$ref: '#/components/schemas/ProfileCredentials'}
      - type: object
        properties:
          local_dir: {type: string}
          remote_dir: {type: string}
          min_history_depth: {type: integer, format: int64, minimum: 0}
          min_history_age_hours: {type: integer, format: int64, minimum: 0}
          bandwidth_limit:
            anyOf:
            - {type: string}
            - {type: 'null'}
          transfer_concurrency:
            anyOf:
            - {type: integer, format: int64, minimum: 0}
            - {type: 'null'}
          rclone_config:
            anyOf:
            - {type: string}
            - {type: 'null'}
          watch_enabled:
            anyOf:
            - {type: boolean}
            - {type: 'null'}
          sync_interval_seconds:
            anyOf:
            - {type: integer, format: int64, minimum: 0}
            - {type: 'null'}
          paused: {type: boolean}
          allow_empty_local: {type: boolean, default: false}
          name: {type: string, pattern: '^[A-Za-z0-9_-]+$'}
          key_storage: {$ref: '#/components/schemas/KeyStorage'}
          verify: {type: boolean, default: false}
        required: [name, local_dir, remote_dir]
    DaemonAutostartStatus:
      type: object
      properties:
        supported: {type: boolean}
        installed: {type: boolean}
        systemd_enabled: {type: boolean}
        method: {type: string}
        location: {type: string}
        command: {type: string}
        detail: {type: string}
      required: [supported, installed, systemd_enabled, method, location, command, detail]
    DaemonEvent:
      type: object
      properties:
        seq: {type: integer, format: int64, minimum: 0}
        timestamp_unix: {type: integer, format: int64}
        profile_name: {type: string}
        kind: {type: string}
        detail: {type: string}
      required: [seq, timestamp_unix, profile_name, kind, detail]
    DaemonProfileState:
      type: string
      enum: [idle, pending_debounce, running_sync, paused, locked, backoff, needs_attention]
    DaemonProfileStatus:
      type: object
      properties:
        name: {type: string}
        key_storage: {$ref: '#/components/schemas/KeyStorage'}
        state: {$ref: '#/components/schemas/DaemonProfileState'}
        paused: {type: boolean}
        locked: {type: boolean}
        watch_enabled: {type: boolean}
        watcher_active: {type: boolean}
        watcher_degraded: {type: boolean}
        warm_transport_active: {type: boolean}
        warm_cache_entries: {type: integer, format: int64, minimum: 0}
        sync_interval_seconds: {type: integer, format: int64, minimum: 0}
        local_dir: {type: string}
        remote_dir: {type: string}
        dirty_paths_count: {type: integer, format: int64, minimum: 0}
        active_stage: {type: string}
