    Job:
      allOf:
      - {$ref: '#/components/schemas/JobSnapshot'}
      - type: object
        properties:
          result:
            anyOf:
            - {$ref: '#/components/schemas/PlanReport'}
            - {$ref: '#/components/schemas/SyncCompleted'}
            - {$ref: '#/components/schemas/FsckCompleted'}
            - {$ref: '#/components/schemas/GarbageCollectCompleted'}
            - {$ref: '#/components/schemas/RepackCompleted'}
            - {$ref: '#/components/schemas/ResolveMissingCompleted'}
            - {$ref: '#/components/schemas/ManualWriterRemovalCompleted'}
            - {$ref: '#/components/schemas/ManualBarrierRemovalCompleted'}
            - {$ref: '#/components/schemas/JobError'}
            - {type: 'null'}
        required: [result]
      - if:
          properties:
            state: {const: completed}
          required: [state]
        then:
          allOf:
          - if:
              properties:
                operation: {const: preview}
              required: [operation]
            then:
              properties:
                result: {$ref: '#/components/schemas/PlanReport'}
          - if:
              properties:
                operation: {const: sync}
              required: [operation]
            then:
              properties:
                result: {$ref: '#/components/schemas/SyncCompleted'}
          - if:
              properties:
                operation: {const: fsck}
              required: [operation]
            then:
              properties:
                result: {$ref: '#/components/schemas/FsckCompleted'}
          - if:
              properties:
                operation: {const: gc}
              required: [operation]
            then:
              properties:
                result: {$ref: '#/components/schemas/GarbageCollectCompleted'}
          - if:
              properties:
                operation: {const: repack}
              required: [operation]
            then:
              properties:
                result: {$ref: '#/components/schemas/RepackCompleted'}
          - if:
              properties:
                operation: {const: resolve-missing}
              required: [operation]
            then:
              properties:
                result: {$ref: '#/components/schemas/ResolveMissingCompleted'}
          - if:
              properties:
                operation: {const: remove-writer}
              required: [operation]
            then:
              properties:
                result: {$ref: '#/components/schemas/ManualWriterRemovalCompleted'}
          - if:
              properties:
                operation: {const: remove-barrier}
              required: [operation]
            then:
              properties:
                result: {$ref: '#/components/schemas/ManualBarrierRemovalCompleted'}
        else:
          if:
            properties:
              state: {const: failed}
            required: [state]
          then:
            properties:
              result: {$ref: '#/components/schemas/JobError'}
          else:
            properties:
              result: {type: 'null'}
