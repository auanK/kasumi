        bind: {type: string}
        port: {type: integer, format: int64, minimum: 0, maximum: 65535}
        allowed_hosts:
          type: array
          items: {type: string}
        skip_host_check: {type: boolean}
        restart_required: {const: true}
      required: [bind, port, allowed_hosts, skip_host_check, restart_required]
    SetPasswordResponse:
      type: object
      properties:
        configured: {const: true}
      required: [configured]
    StreamStatus:
      type: object
      properties:
        profiles:
          type: array
          items: {$ref: '#/components/schemas/DaemonProfileStatus'}
        uptime_seconds: {type: integer, format: int64, minimum: 0}
        jobs:
          type: array
          items: {$ref: '#/components/schemas/JobSnapshot'}
      required: [profiles, uptime_seconds, jobs]
    SyncCompleted:
      type: object
      properties:
        total: {type: integer, format: int64, minimum: 0}
        uploaded: {type: integer, format: int64, minimum: 0}
        downloaded: {type: integer, format: int64, minimum: 0}
        removed: {type: integer, format: int64, minimum: 0}
        renamed: {type: integer, format: int64, minimum: 0}
        copied: {type: integer, format: int64, minimum: 0}
        created_dirs: {type: integer, format: int64, minimum: 0}
        removed_dirs: {type: integer, format: int64, minimum: 0}
        repaired: {type: integer, format: int64, minimum: 0}
        upload_bytes: {type: integer, format: int64, minimum: 0}
        download_bytes: {type: integer, format: int64, minimum: 0}
        published: {type: boolean}
        pending: {type: integer, format: int64, minimum: 0}
        pending_paths:
          type: array
          items: {type: string}
        partial: {type: boolean}
        wire_upload_bytes: {type: integer, format: int64, minimum: 0}
        wire_download_bytes: {type: integer, format: int64, minimum: 0}
        local_delta_reused_bytes: {type: integer, format: int64, minimum: 0}
        physical_objects_uploaded: {type: integer, format: int64, minimum: 0}
        physical_objects_downloaded: {type: integer, format: int64, minimum: 0}
        duration_ms:
          anyOf:
          - {type: number}
          - {type: 'null'}
        inventory_audit: {$ref: '#/components/schemas/InventoryAuditReport'}
        warning: {type: string}
      required: [total, uploaded, downloaded, removed, renamed, copied, created_dirs, removed_dirs, repaired, upload_bytes,
        download_bytes, published, pending, pending_paths, partial, wire_upload_bytes, wire_download_bytes, local_delta_reused_bytes,
        physical_objects_uploaded, physical_objects_downloaded, duration_ms]
    SyncProgress:
      type: object
      properties:
        stage: {$ref: '#/components/schemas/SyncStage'}
        total_items: {type: integer, format: int64, minimum: 0}
        applied_items:
          anyOf:
          - {type: integer, format: int64, minimum: 0}
          - {type: 'null'}
      required: [stage, total_items, applied_items]
    SyncStage:
      type: string
      enum: [observing, calculating, applying, publishing, finalizing]
    SyncTriggered:
      type: object
      properties:
        profiles:
          type: array
          items: {type: string}
        completed: {type: boolean}
        failures:
          type: array
          items:
            type: object
            properties:
              profile: {type: string}
              detail: {type: string}
            required: [profile, detail]
      required: [profiles, completed, failures]
    TextRevision:
      type: object
      properties:
        path: {type: string}
        hash: {type: string}
        text: {type: string}
      required: [path, hash, text]
