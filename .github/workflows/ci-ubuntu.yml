name: CI - Ubuntu

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: GCC 14
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CC: gcc-14
      CXX: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf 'http://azure.archive.ubuntu.com/ubuntu/\nhttp://archive.ubuntu.com/ubuntu/\n' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build gcc-14 g++-14 git unzip \
            gnome-keyring libsecret-1-0 libsecret-tools dbus-x11 python3-dbus
          sudo apt-get install -y --no-install-recommends kwallet6 || \
            sudo apt-get install -y --no-install-recommends libkf5wallet-bin
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100 --slave /usr/bin/g++ g++ /usr/bin/g++-14
          sudo update-alternatives --set gcc /usr/bin/gcc-14

      - name: Display tool versions
        run: |
          cmake --version
          gcc-14 --version
          g++-14 --version
          ninja --version

      - name: Build (Debug)
        run: |
          cmake --preset debug
          cmake --build --preset debug -j$(nproc)

      - name: Run Tests (Debug)
        run: |
          python3 scripts/run_with_linux_vault.py --backend gnome -- \
            ctest --preset debug --output-on-failure

      - name: Run Vault Tests (KDE KWallet)
        run: |
          python3 scripts/run_with_linux_vault.py --backend kwallet -- \
            ctest --preset debug -R "VaultTest|ApplicationProfileTest.DefaultVaultStorageLifecycleDoesNotWriteKeyFile|kasumi_cli_process_contract" --output-on-failure --no-tests=error

      - name: Build (Release)
        run: |
          cmake --preset default
          cmake --build --preset default -j$(nproc)

      - name: Run Tests (Release)
        run: |
          python3 scripts/run_with_linux_vault.py --backend gnome -- \
            ctest --test-dir build --output-on-failure

  sanitizers:
    name: Clang 19 (ASan + UBSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CC: clang-19
      CXX: clang++-19
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf 'http://azure.archive.ubuntu.com/ubuntu/\nhttp://archive.ubuntu.com/ubuntu/\n' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build clang-19 clang-tools-19 libclang-rt-19-dev libstdc++-14-dev git unzip \
            gnome-keyring libsecret-1-0 libsecret-tools dbus-x11

      - name: Configure (Debug, ASan + UBSan)
        run: |
          cmake -S . -B build-sanitizers -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"

      - name: Build
        run: cmake --build build-sanitizers --parallel 2

      - name: Run Tests
        run: |
          python3 scripts/run_with_linux_vault.py --backend gnome -- \
            ctest --test-dir build-sanitizers --output-on-failure --no-tests=error

  clang:
    name: Clang 19
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CC: clang-19
      CXX: clang++-19

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf 'http://azure.archive.ubuntu.com/ubuntu/\nhttp://archive.ubuntu.com/ubuntu/\n' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build clang-19 clang-tools-19 lld-19 libstdc++-14-dev git unzip \
            gnome-keyring libsecret-1-0 libsecret-tools dbus-x11

      - name: Display tool versions
        run: |
          cmake --version
          clang-19 --version
          clang++-19 --version
          clang-scan-deps-19 --version
          command -v clang-scan-deps-19
          ninja --version

      - name: Verify C++23 std::expected toolchain support
        run: |
          echo '#include <expected>' > /tmp/check_expected.cpp
          echo 'std::expected<int, int> f() { return 1; } int main() { return f().has_value() ? 0 : 1; }' >> /tmp/check_expected.cpp
          clang++-19 -std=c++23 /tmp/check_expected.cpp -o /tmp/check_expected
          /tmp/check_expected

      - name: Build (Debug)
        run: |
          cmake -S . -B build-clang-debug -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=clang-19 -DCMAKE_CXX_COMPILER=clang++-19 -DBUILD_TESTING=ON
          cmake --build build-clang-debug -j$(nproc)

      - name: Run Tests (Debug)
        run: |
          python3 scripts/run_with_linux_vault.py --backend gnome -- \
            ctest --test-dir build-clang-debug --output-on-failure

      - name: Build (Release)
        run: |
          cmake -S . -B build-clang-release -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang-19 -DCMAKE_CXX_COMPILER=clang++-19 -DBUILD_TESTING=ON
          cmake --build build-clang-release -j$(nproc)

      - name: Run Tests (Release)
        run: |
          python3 scripts/run_with_linux_vault.py --backend gnome -- \
            ctest --test-dir build-clang-release --output-on-failure
