name: CI - Ubuntu

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

defaults:
  run:
    shell: bash

jobs:
  ensure-image:
    name: Ensure CI Image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout Dockerfile
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/docker

      - name: Compute image tag
        id: meta
        run: |
          owner="$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          hash="$(sha256sum .github/docker/ci-ubuntu.Dockerfile | cut -c1-12)"
          echo "image=ghcr.io/${owner}/kasumi-ci:ubuntu-24.04-${hash}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if CI image exists
        id: check
        run: |
          if docker manifest inspect "${{ steps.meta.outputs.image }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.check.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build and push CI image
        if: steps.check.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .github/docker
          file: .github/docker/ci-ubuntu.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-test:
    name: GCC 14
    needs: ensure-image
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: ${{ needs.ensure-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --init
    env:
      CC: gcc-14
      CXX: g++-14
      CCACHE_DIR: /tmp/ccache-gcc14
      CCACHE_MAXSIZE: 1G

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Cache ccache (GCC 14)
        uses: actions/cache@v6
        with:
          path: /tmp/ccache-gcc14
          key: ccache-ubuntu-gcc14-${{ github.sha }}
          restore-keys: |
            ccache-ubuntu-gcc14-

      - name: Cache FetchContent sources
        uses: actions/cache@v6
        with:
          path: /tmp/kasumi-fc-cache
          key: fetchcontent-ubuntu-${{ hashFiles('CMakeLists.txt') }}

      - name: Display tool versions
        run: |
          id
          cmake --version
          gcc-14 --version
          g++-14 --version
          ninja --version
          ccache --version

      - name: Build (Debug)
        run: |
          cmake --preset debug \
            -DKASUMI_FETCHCONTENT_CACHE_DIR=/tmp/kasumi-fc-cache \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build --preset debug -j$(nproc)

      - name: Run Tests (Debug)
        run: |
          python3 scripts/run_with_linux_vault.py --backend gnome -- \
            ctest --preset debug --output-on-failure --parallel $(nproc)

      - name: Run Vault Tests (KDE KWallet)
        run: |
          python3 scripts/run_with_linux_vault.py --backend kwallet -- \
            ctest --preset debug -R "VaultTest|ApplicationProfileTest.DefaultVaultStorageLifecycleDoesNotWriteKeyFile|kasumi_cli_process_contract" --output-on-failure --no-tests=error --parallel $(nproc)

      - name: Build (Release)
        run: |
          cmake --preset default \
            -DKASUMI_FETCHCONTENT_CACHE_DIR=/tmp/kasumi-fc-cache \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build --preset default -j$(nproc)
          ccache -s

      - name: Run Tests (Release)
        run: |
          python3 scripts/run_with_linux_vault.py --backend gnome -- \
            ctest --test-dir build --output-on-failure --parallel $(nproc)

  sanitizers:
    name: Clang 19 (ASan + UBSan)
    needs: ensure-image
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: ${{ needs.ensure-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --init
    env:
      CC: clang-19
      CXX: clang++-19
      CCACHE_DIR: /tmp/ccache-clang19-sanitizers
      CCACHE_MAXSIZE: 1G
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Cache ccache (Clang 19 Sanitizers)
        uses: actions/cache@v6
        with:
          path: /tmp/ccache-clang19-sanitizers
          key: ccache-ubuntu-clang19-sanitizers-${{ github.sha }}
          restore-keys: |
            ccache-ubuntu-clang19-sanitizers-

      - name: Cache FetchContent sources
        uses: actions/cache@v6
        with:
          path: /tmp/kasumi-fc-cache
          key: fetchcontent-ubuntu-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure (Debug, ASan + UBSan)
        run: |
          cmake -S . -B build-sanitizers -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON \
            -DKASUMI_FETCHCONTENT_CACHE_DIR=/tmp/kasumi-fc-cache \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld" \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"

      - name: Build
        run: |
          cmake --build build-sanitizers --parallel 2
          ccache -s

      - name: Run Tests
        run: |
          python3 scripts/run_with_linux_vault.py --backend gnome -- \
            ctest --test-dir build-sanitizers --output-on-failure --no-tests=error --parallel 2

  clang:
    name: Clang 19
    needs: ensure-image
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: ${{ needs.ensure-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --init
    env:
      CC: clang-19
      CXX: clang++-19
      CCACHE_DIR: /tmp/ccache-clang19
      CCACHE_MAXSIZE: 1G

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Cache ccache (Clang 19)
        uses: actions/cache@v6
        with:
          path: /tmp/ccache-clang19
          key: ccache-ubuntu-clang19-${{ github.sha }}
          restore-keys: |
            ccache-ubuntu-clang19-

      - name: Cache FetchContent sources
        uses: actions/cache@v6
        with:
          path: /tmp/kasumi-fc-cache
          key: fetchcontent-ubuntu-${{ hashFiles('CMakeLists.txt') }}

      - name: Display tool versions
        run: |
          id
          cmake --version
          clang-19 --version
          clang++-19 --version
          clang-scan-deps-19 --version
          command -v clang-scan-deps-19
          ninja --version
          ccache --version

      - name: Verify C++23 std::expected toolchain support
        run: |
          echo '#include <expected>' > /tmp/check_expected.cpp
          echo 'std::expected<int, int> f() { return 1; } int main() { return f().has_value() ? 0 : 1; }' >> /tmp/check_expected.cpp
          clang++-19 -std=c++23 /tmp/check_expected.cpp -o /tmp/check_expected
          /tmp/check_expected

      - name: Build (Debug)
        run: |
          cmake -S . -B build-clang-debug -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang-19 -DCMAKE_CXX_COMPILER=clang++-19 \
            -DKASUMI_FETCHCONTENT_CACHE_DIR=/tmp/kasumi-fc-cache \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld" \
            -DBUILD_TESTING=ON
          cmake --build build-clang-debug -j$(nproc)

      - name: Run Tests (Debug)
        run: |
          python3 scripts/run_with_linux_vault.py --backend gnome -- \
            ctest --test-dir build-clang-debug --output-on-failure --parallel $(nproc)

      - name: Build (Release)
        run: |
          cmake -S . -B build-clang-release -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-19 -DCMAKE_CXX_COMPILER=clang++-19 \
            -DKASUMI_FETCHCONTENT_CACHE_DIR=/tmp/kasumi-fc-cache \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld" \
            -DBUILD_TESTING=ON
          cmake --build build-clang-release -j$(nproc)
          ccache -s

      - name: Run Tests (Release)
        run: |
          python3 scripts/run_with_linux_vault.py --backend gnome -- \
            ctest --test-dir build-clang-release --output-on-failure --parallel $(nproc)
