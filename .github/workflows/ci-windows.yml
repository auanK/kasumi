name: CI - Windows

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  msvc:
    name: MSVC 2022
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Display tool versions
        shell: powershell
        run: |
          cmake --version
          ninja --version

      - name: Build (Debug)
        shell: powershell
        run: |
          cmake -S . -B build-ci-debug -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON
          cmake --build build-ci-debug --config Debug --parallel

      - name: Run Tests (Debug)
        shell: powershell
        run: |
          ctest --test-dir build-ci-debug -C Debug --output-on-failure

      - name: Build (Release)
        shell: powershell
        run: |
          cmake -S . -B build-ci-release -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON
          cmake --build build-ci-release --config Release --parallel

      - name: Run Tests (Release)
        shell: powershell
        run: |
          ctest --test-dir build-ci-release -C Release --output-on-failure

  gcc:
    name: GCC (MSYS2 UCRT64)
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: msys2 {0}
    env:
      CC: gcc
      CXX: g++

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure MSYS2 (UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-cmake
            git

      - name: Verify MSYS2 toolchain
        run: |
          test "$MSYSTEM" = "UCRT64"

          command -v gcc
          command -v g++
          command -v cmake
          command -v ninja

          gcc --version
          g++ --version
          cmake --version
          ninja --version

          for tool in gcc g++ cmake ninja; do
            tool_path=$(command -v "$tool")
            echo "$tool path: $tool_path"
            case "$tool_path" in
              /ucrt64/bin/*) ;;
              *)
                echo "ERROR: $tool is not from /ucrt64/bin/ (found: $tool_path)" >&2
                exit 1
                ;;
            esac
          done

      - name: Build (Debug)
        run: |
          cmake --preset debug
          cmake --build --preset debug

      - name: Run Tests (Debug)
        run: |
          ctest --preset debug --output-on-failure --parallel 2

      - name: Build (Release)
        run: |
          cmake --preset default -DBUILD_TESTING=ON
          cmake --build --preset default

      - name: Run Tests (Release)
        run: |
          ctest --test-dir build --output-on-failure --parallel 2
