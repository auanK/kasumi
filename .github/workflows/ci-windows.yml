name: CI - Windows

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  msvc:
    name: MSVC 2022
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Display tool versions
        shell: powershell
        run: |
          cmake --version
          ninja --version

      - name: Build (Debug)
        shell: powershell
        run: |
          cmake -S . -B build-ci-debug -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON
          cmake --build build-ci-debug --config Debug --parallel

      - name: Run Tests (Debug)
        shell: powershell
        run: |
          ctest --test-dir build-ci-debug -C Debug --output-on-failure

      - name: Build (Release)
        shell: powershell
        run: |
          cmake -S . -B build-ci-release -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON
          cmake --build build-ci-release --config Release --parallel

      - name: Run Tests (Release)
        shell: powershell
        run: |
          ctest --test-dir build-ci-release -C Release --output-on-failure

  gcc:
    name: GCC 14 (MSYS2 UCRT64)
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      CC: gcc
      CXX: g++

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure MSYS2 (UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-cmake
            git

      - name: Prioritize MSYS2 UCRT64 in PATH
        shell: powershell
        run: |
          "C:\msys64\ucrt64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Display tool versions
        shell: powershell
        run: |
          Get-Command gcc | Select-Object -ExpandProperty Source
          Get-Command g++ | Select-Object -ExpandProperty Source
          gcc --version
          g++ --version
          cmake --version
          ninja --version

      - name: Build (Debug)
        shell: powershell
        run: |
          cmake --preset debug
          cmake --build --preset debug

      - name: Run Tests (Debug)
        shell: powershell
        run: |
          ctest --preset debug --output-on-failure --parallel 2

      - name: Build (Release)
        shell: powershell
        run: |
          cmake --preset default -DBUILD_TESTING=ON
          cmake --build --preset default

      - name: Run Tests (Release)
        shell: powershell
        run: |
          ctest --test-dir build --output-on-failure --parallel 2
