name: CI Image - Ubuntu

on:
  push:
    branches: [ main ]
    paths:
      - .github/docker/ci-ubuntu.Dockerfile
      - .github/workflows/ci-image.yml
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:

concurrency:
  group: ci-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and push GHCR Ubuntu CI image
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Compute image tags
        id: meta
        run: |
          owner="$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          hash="$(sha256sum .github/docker/ci-ubuntu.Dockerfile | cut -c1-12)"
          echo "tags=ghcr.io/${owner}/kasumi-ci:ubuntu-24.04-${hash},ghcr.io/${owner}/kasumi-ci:ubuntu-24.04" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push CI image
        uses: docker/build-push-action@v7
        with:
          context: .github/docker
          file: .github/docker/ci-ubuntu.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
