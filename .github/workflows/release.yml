name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    name: Linux (x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CC: gcc-14
      CXX: g++-14

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-14 g++-14 git
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100 --slave /usr/bin/g++ g++ /usr/bin/g++-14
          sudo update-alternatives --set gcc /usr/bin/gcc-14

      - name: Build (Release)
        run: |
          cmake --preset default
          cmake --build --preset default -j$(nproc)

      - name: Release Gate - Critical Tests
        run: |
          ctest --test-dir build -L release-critical --output-on-failure

      - name: Release Gate - Smoke Test (Binary)
        run: |
          ./build/kasumi --version
          ./build/kasumi --help

      - name: Package
        run: |
          mkdir -p package
          cp build/kasumi LICENSE THIRD_PARTY_NOTICES.md package/
          cd package
          tar -czf ../kasumi-linux-x86_64.tar.gz kasumi LICENSE THIRD_PARTY_NOTICES.md
          cd ..
          sha256sum kasumi-linux-x86_64.tar.gz > kasumi-linux-x86_64.tar.gz.sha256

      - name: Release Gate - Verify Package
        env:
          KASUMI_RELEASE_EVENT: ${{ github.event_name }}
          KASUMI_RELEASE_REF_TYPE: ${{ github.ref_type }}
          KASUMI_RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          python3 scripts/verify_release_package.py \
            --archive kasumi-linux-x86_64.tar.gz \
            --checksum kasumi-linux-x86_64.tar.gz.sha256 \
            --event-name "$KASUMI_RELEASE_EVENT" \
            --ref-type "$KASUMI_RELEASE_REF_TYPE" \
            --ref-name "$KASUMI_RELEASE_REF_NAME"

      - name: Upload Artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: kasumi-linux-x86_64
          path: |
            kasumi-linux-x86_64.tar.gz
            kasumi-linux-x86_64.tar.gz.sha256

  build-windows:
    name: Windows (x86_64)
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Build (Release MSVC)
        shell: powershell
        run: |
          cmake -S . -B build-release -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build-release --config Release --parallel

      - name: Release Gate - Critical Tests
        shell: powershell
        run: |
          ctest --test-dir build-release -C Release -L release-critical --output-on-failure

      - name: Release Gate - Smoke Test (Binary)
        shell: powershell
        run: |
          $exe = ".\build-release\Release\kasumi.exe"
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "Binary smoke test --version failed with code $LASTEXITCODE" }
          & $exe --help
          if ($LASTEXITCODE -ne 0) { throw "Binary smoke test --help failed with code $LASTEXITCODE" }

      - name: Release Gate - Verify Runtime Dependencies (Static MSVC)
        shell: powershell
        run: |
          $exe = ".\build-release\Release\kasumi.exe"
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
              throw "Release executable not found: $exe"
          }
          if (-not (Get-Command dumpbin -CommandType Application -ErrorAction SilentlyContinue)) {
              $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
              if (Test-Path $vswhere) {
                  $vsPath = & $vswhere -latest -property installationPath
                  $devShell = Join-Path $vsPath "Common7\Tools\Launch-VsDevShell.ps1"
                  if (Test-Path $devShell) {
                      & $devShell -Arch amd64
                  }
              }
          }
          $dumpbin = Get-Command dumpbin -CommandType Application -ErrorAction SilentlyContinue
          if (-not $dumpbin) {
              throw "dumpbin was not found; cannot verify Windows runtime dependencies."
          }
          $deps = & $dumpbin.Source /DEPENDENTS $exe 2>&1
          $dumpbinExitCode = $LASTEXITCODE
          if ($dumpbinExitCode -ne 0) {
              throw "dumpbin /DEPENDENTS failed with exit code $dumpbinExitCode."
          }
          $depsText = $deps | Out-String
          Write-Host "--- DLL Dependencies for $exe ---"
          $depsText | Write-Host
          if ([string]::IsNullOrWhiteSpace($depsText) -or
              $depsText -notmatch '(?im)^[ \t]*Image has the following dependencies:?[ \t]*\r?$' -or
              $depsText -notmatch '(?im)^[ \t]*[A-Za-z0-9_.-]+\.dll[ \t]*\r?$') {
              throw "dumpbin returned an empty or invalid dependency report."
          }
          $prohibited = @("VCRUNTIME", "MSVCP", "utf8proc", "sqlite3", "monocypher", "blake3", "reproc")
          foreach ($pattern in $prohibited) {
              $match = $depsText | Select-String -Pattern $pattern
              if ($match) {
                  throw "ERROR: Prohibited dependency detected in Windows Release binary: $pattern"
              }
          }

      - name: Package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path package
          Copy-Item build-release/Release/kasumi.exe package/
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md package/
          Compress-Archive -Path package/* -DestinationPath kasumi-windows-x86_64.zip
          $hash = (Get-FileHash kasumi-windows-x86_64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash *kasumi-windows-x86_64.zip" | Out-File -FilePath kasumi-windows-x86_64.zip.sha256 -Encoding ascii

      - name: Release Gate - Verify Package
        shell: powershell
        env:
          KASUMI_RELEASE_EVENT: ${{ github.event_name }}
          KASUMI_RELEASE_REF_TYPE: ${{ github.ref_type }}
          KASUMI_RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          python scripts/verify_release_package.py `
            --archive kasumi-windows-x86_64.zip `
            --checksum kasumi-windows-x86_64.zip.sha256 `
            --event-name $env:KASUMI_RELEASE_EVENT `
            --ref-type $env:KASUMI_RELEASE_REF_TYPE `
            --ref-name $env:KASUMI_RELEASE_REF_NAME
          if ($LASTEXITCODE -ne 0) { throw "Release package verification failed with code $LASTEXITCODE" }

      - name: Upload Artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: kasumi-windows-x86_64
          path: |
            kasumi-windows-x86_64.zip
            kasumi-windows-x86_64.zip.sha256

  publish:
    name: Publish Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout release metadata
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate Release metadata
        run: |
          test -f RELEASE_NOTES.md
          test -s RELEASE_NOTES.md

      - name: Download all artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: dist
          merge-multiple: true

      - name: Validate and consolidate SHA-256 checksums
        run: |
          cd dist
          sha256sum -c kasumi-linux-x86_64.tar.gz.sha256
          sha256sum -c kasumi-windows-x86_64.zip.sha256
          cat kasumi-linux-x86_64.tar.gz.sha256 kasumi-windows-x86_64.zip.sha256 > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          ls -la

      - name: Generate Artifact Attestations (Build Provenance)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/kasumi-linux-x86_64.tar.gz
            dist/kasumi-windows-x86_64.zip
            dist/SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/kasumi-linux-x86_64.tar.gz
            dist/kasumi-linux-x86_64.tar.gz.sha256
            dist/kasumi-windows-x86_64.zip
            dist/kasumi-windows-x86_64.zip.sha256
            dist/SHA256SUMS.txt
          body_path: RELEASE_NOTES.md
          prerelease: ${{ startsWith(github.ref, 'refs/tags/v0.') }}
