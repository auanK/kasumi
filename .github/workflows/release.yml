name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    name: Linux (x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CC: gcc-14
      CXX: g++-14

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-14 g++-14 git
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100 --slave /usr/bin/g++ g++ /usr/bin/g++-14
          sudo update-alternatives --set gcc /usr/bin/gcc-14

      - name: Compilar (Release)
        run: |
          cmake --preset default
          cmake --build --preset default -j$(nproc)

      - name: Release Gate - Testes Críticos
        run: |
          ctest --test-dir build -L release-critical --output-on-failure

      - name: Release Gate - Smoke Test (Binário)
        run: |
          ./build/kasumi --version
          ./build/kasumi --help

      - name: Empacotar
        run: |
          mkdir -p package
          cp build/kasumi package/
          cp README.md LICENSE CHANGELOG.md THIRD_PARTY_NOTICES.md package/
          cd package
          tar -czvf ../kasumi-linux-x86_64.tar.gz kasumi README.md LICENSE CHANGELOG.md THIRD_PARTY_NOTICES.md
          cd ..
          sha256sum kasumi-linux-x86_64.tar.gz > kasumi-linux-x86_64.tar.gz.sha256

      - name: Release Gate - Smoke Test (Pacote Extraído)
        run: |
          mkdir -p /tmp/smoke-package
          tar -xzvf kasumi-linux-x86_64.tar.gz -C /tmp/smoke-package
          test -f /tmp/smoke-package/kasumi
          test -x /tmp/smoke-package/kasumi
          test -f /tmp/smoke-package/THIRD_PARTY_NOTICES.md
          /tmp/smoke-package/kasumi --version
          /tmp/smoke-package/kasumi --help
          rm -rf /tmp/smoke-package

      - name: Upload Artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: kasumi-linux-x86_64
          path: |
            kasumi-linux-x86_64.tar.gz
            kasumi-linux-x86_64.tar.gz.sha256

  build-windows:
    name: Windows (x86_64)
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Compilar (Release MSVC)
        shell: powershell
        run: |
          cmake -S . -B build-release -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build-release --config Release --parallel

      - name: Release Gate - Testes Críticos
        shell: powershell
        run: |
          ctest --test-dir build-release -C Release -L release-critical --output-on-failure

      - name: Release Gate - Smoke Test (Binário)
        shell: powershell
        run: |
          $exe = ".\build-release\Release\kasumi.exe"
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "Smoke test binário --version falhou com código $LASTEXITCODE" }
          & $exe --help
          if ($LASTEXITCODE -ne 0) { throw "Smoke test binário --help falhou com código $LASTEXITCODE" }

      - name: Release Gate - Verificar Dependências de Runtime (MSVC Estático)
        shell: powershell
        run: |
          if (-not (Get-Command dumpbin -ErrorAction SilentlyContinue)) {
              $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
              if (Test-Path $vswhere) {
                  $vsPath = & $vswhere -latest -property installationPath
                  $devShell = Join-Path $vsPath "Common7\Tools\Launch-VsDevShell.ps1"
                  if (Test-Path $devShell) {
                      & $devShell -Arch amd64
                  }
              }
          }
          $exe = ".\build-release\Release\kasumi.exe"
          $deps = & dumpbin /DEPENDENTS $exe
          Write-Host "--- DLL Dependencies de $exe ---"
          $deps | Write-Host
          $prohibited = @("VCRUNTIME", "MSVCP", "utf8proc", "sqlite3", "monocypher", "blake3", "reproc")
          foreach ($pattern in $prohibited) {
              $match = $deps | Select-String -Pattern $pattern
              if ($match) {
                  throw "ERRO: Dependência proibida detectada no binário Release Windows: $pattern"
              }
          }

      - name: Empacotar
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path package
          Copy-Item build-release/Release/kasumi.exe package/
          Copy-Item README.md, LICENSE, CHANGELOG.md, THIRD_PARTY_NOTICES.md package/
          Compress-Archive -Path package/* -DestinationPath kasumi-windows-x86_64.zip
          $hash = (Get-FileHash kasumi-windows-x86_64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash *kasumi-windows-x86_64.zip" | Out-File -FilePath kasumi-windows-x86_64.zip.sha256 -Encoding ascii

      - name: Release Gate - Smoke Test (Pacote Extraído)
        shell: powershell
        run: |
          $tempExtractDir = Join-Path $env:RUNNER_TEMP "smoke-package"
          if (Test-Path $tempExtractDir) { Remove-Item -Recurse -Force $tempExtractDir }
          Expand-Archive -Path kasumi-windows-x86_64.zip -DestinationPath $tempExtractDir
          $extractedExe = Join-Path $tempExtractDir "kasumi.exe"
          if (-not (Test-Path $extractedExe)) {
              throw "kasumi.exe não encontrado no pacote extraído!"
          }
          $extractedNotices = Join-Path $tempExtractDir "THIRD_PARTY_NOTICES.md"
          if (-not (Test-Path $extractedNotices)) {
              throw "THIRD_PARTY_NOTICES.md não encontrado no pacote extraído!"
          }
          & $extractedExe --version
          if ($LASTEXITCODE -ne 0) { throw "Smoke test pacote extraído --version falhou com código $LASTEXITCODE" }
          & $extractedExe --help
          if ($LASTEXITCODE -ne 0) { throw "Smoke test pacote extraído --help falhou com código $LASTEXITCODE" }
          Remove-Item -Recurse -Force $tempExtractDir

      - name: Upload Artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: kasumi-windows-x86_64
          path: |
            kasumi-windows-x86_64.zip
            kasumi-windows-x86_64.zip.sha256

  publish:
    name: Publicar Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout release metadata
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validar metadados da Release
        run: |
          test -f RELEASE_NOTES.md
          test -s RELEASE_NOTES.md

      - name: Download all artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: dist
          merge-multiple: true

      - name: Validar e consolidar checksums SHA-256
        run: |
          cd dist
          sha256sum -c kasumi-linux-x86_64.tar.gz.sha256
          sha256sum -c kasumi-windows-x86_64.zip.sha256
          cat kasumi-linux-x86_64.tar.gz.sha256 kasumi-windows-x86_64.zip.sha256 > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          ls -la

      - name: Gerar Artifact Attestations (Build Provenance)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/kasumi-linux-x86_64.tar.gz
            dist/kasumi-windows-x86_64.zip
            dist/SHA256SUMS.txt

      - name: Criar GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/kasumi-linux-x86_64.tar.gz
            dist/kasumi-linux-x86_64.tar.gz.sha256
            dist/kasumi-windows-x86_64.zip
            dist/kasumi-windows-x86_64.zip.sha256
            dist/SHA256SUMS.txt
          body_path: RELEASE_NOTES.md
