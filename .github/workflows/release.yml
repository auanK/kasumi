name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    name: Linux (x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CC: gcc-14
      CXX: g++-14

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf 'http://mirrors.edge.kernel.org/ubuntu/\nhttp://us.archive.ubuntu.com/ubuntu/\nhttp://archive.ubuntu.com/ubuntu/\n' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          sudo tee /etc/apt/apt.conf.d/80-retries >/dev/null <<'EOF'
          Acquire::Retries "5";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          Acquire::ForceIPv4 "true";
          EOF
          apt_install_missing() {
            missing=()
            for pkg in "$@"; do
              dpkg -s "$pkg" >/dev/null 2>&1 || missing+=("$pkg")
            done
            if [ "${#missing[@]}" -eq 0 ]; then
              return 0
            fi
            for attempt in 1 2 3; do
              if sudo apt-get update && sudo apt-get install -y --no-install-recommends --fix-missing "${missing[@]}"; then
                return 0
              fi
              echo "apt-get install failed (attempt ${attempt}/3), retrying in 10s..." >&2
              sleep 10
            done
            return 1
          }
          apt_install_missing cmake ninja-build ccache gcc-14 g++-14 git \
            gnome-keyring libsecret-1-0 dbus-x11 dpkg-dev rpm file zstd
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100 --slave /usr/bin/g++ g++ /usr/bin/g++-14
          sudo update-alternatives --set gcc /usr/bin/gcc-14

      - name: Cache FetchContent sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/kasumi-fc-cache
          key: fetchcontent-ubuntu-${{ hashFiles('CMakeLists.txt') }}

      - name: Cache ccache (Release Linux)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache-release-linux
          key: ccache-release-linux-${{ github.sha }}
          restore-keys: |
            ccache-release-linux-
            ccache-ubuntu-gcc14-

      - name: Build Web UI
        working-directory: web
        run: |
          node --version
          npm ci
          npm test
          npm run build

      - name: Build (Release)
        env:
          CCACHE_DIR: ${{ runner.temp }}/ccache-release-linux
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_NOHASHDIR: "1"
          CCACHE_MAXSIZE: 2G
        run: |
          cmake --preset default -DBUILD_TESTING=OFF \
            -DKASUMI_FETCHCONTENT_CACHE_DIR="${RUNNER_TEMP}/kasumi-fc-cache" \
            -DKASUMI_ENABLE_IPO=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build --preset default -j$(nproc)
          cmake -S . -B build-tests -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DKASUMI_FETCHCONTENT_CACHE_DIR="${RUNNER_TEMP}/kasumi-fc-cache" \
            -DKASUMI_ENABLE_IPO=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build-tests -j$(nproc)
          ccache -s

      - name: Release Gate - Critical Tests
        run: |
          python3 scripts/run_with_linux_vault.py --backend gnome -- \
            ctest --test-dir build-tests -L release-critical --output-on-failure --no-tests=error --parallel $(nproc)

      - name: Release Gate - Smoke Test (Binary)
        run: |
          ./build/kasumi --version
          ./build/kasumi --help
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          mkdir -p "$tmp/local" "$tmp/storage" "$tmp/cfg"
          printf 'x' > "$tmp/local/item.txt"
          vault_err="$(printf "n\nsmoke\n%s\n%s\n\n:back\nq\n" "$tmp/local" "$tmp/storage" | \
            env -u DBUS_SESSION_BUS_ADDRESS XDG_RUNTIME_DIR="$tmp/no-bus" XDG_CONFIG_HOME="$tmp/cfg" \
            KASUMI_LANG=en KASUMI_PASSWORD="smoke-password-123" KASUMI_PASSWORD2="smoke-salt-value-16" \
            ./build/kasumi config 2>&1)"
          if ! printf '%s' "$vault_err" | grep -qi "no active D-Bus session bus"; then
            printf '%s\n' "$vault_err" >&2
            exit 1
          fi
          test ! -e "$tmp/cfg/kasumi/config.toml"
          printf "n\nsmoke\n%s\n%s\nfile\nq\n" "$tmp/local" "$tmp/storage" | \
            env -u DBUS_SESSION_BUS_ADDRESS XDG_RUNTIME_DIR="$tmp/no-bus" XDG_CONFIG_HOME="$tmp/cfg" \
            KASUMI_LANG=en KASUMI_PASSWORD="smoke-password-123" KASUMI_PASSWORD2="smoke-salt-value-16" \
            ./build/kasumi config >/dev/null
          env -u DBUS_SESSION_BUS_ADDRESS XDG_RUNTIME_DIR="$tmp/no-bus" XDG_CONFIG_HOME="$tmp/cfg" \
            KASUMI_LANG=en ./build/kasumi sync smoke >/dev/null
          env -u DBUS_SESSION_BUS_ADDRESS XDG_RUNTIME_DIR="$tmp/no-bus" XDG_CONFIG_HOME="$tmp/cfg" \
            KASUMI_LANG=en ./build/kasumi list | grep -q "smoke"

      - name: Package
        run: |
          VERSION="$(python3 -c 'import re; print(re.search(r"project\(kasumi\s+VERSION\s+([0-9]+\.[0-9]+\.[0-9]+)", open("CMakeLists.txt").read()).group(1))')"
          echo "KASUMI_VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p package
          cp build/kasumi LICENSE THIRD_PARTY_NOTICES.md package/
          cd package
          tar -czf "../kasumi-v${VERSION}-linux-x86_64.tar.gz" kasumi LICENSE THIRD_PARTY_NOTICES.md
          cd ..
          sha256sum "kasumi-v${VERSION}-linux-x86_64.tar.gz" > "kasumi-v${VERSION}-linux-x86_64.tar.gz.sha256"

          chmod 0755 packaging/linux/deb/postinst
          mkdir -p cpack-out
          cpack --config build/CPackConfig.cmake -G DEB -B cpack-out
          cpack --config build/CPackConfig.cmake -G RPM -B cpack-out
          mv "cpack-out/kasumi-v${VERSION}-linux-x86_64.deb" "cpack-out/kasumi-v${VERSION}-linux-x86_64.rpm" .
          rm -rf cpack-out

          python3 scripts/build_arch_package.py \
            --binary build/kasumi \
            --version "$VERSION" \
            --install-script packaging/arch/kasumi.install \
            --output "kasumi-v${VERSION}-linux-x86_64.pkg.tar.zst"

          for pkg in "kasumi-v${VERSION}-linux-x86_64.deb" "kasumi-v${VERSION}-linux-x86_64.rpm" "kasumi-v${VERSION}-linux-x86_64.pkg.tar.zst"; do
            test -s "$pkg"
            sha256sum "$pkg" > "$pkg.sha256"
          done
          ls -la "kasumi-v${VERSION}-linux-x86_64."*

      - name: Release Gate - Verify Package
        env:
          KASUMI_RELEASE_EVENT: ${{ github.event_name }}
          KASUMI_RELEASE_REF_TYPE: ${{ github.ref_type }}
          KASUMI_RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          python3 scripts/verify_release_package.py \
            --archive "kasumi-v${KASUMI_VERSION}-linux-x86_64.tar.gz" \
            --checksum "kasumi-v${KASUMI_VERSION}-linux-x86_64.tar.gz.sha256" \
            --event-name "$KASUMI_RELEASE_EVENT" \
            --ref-type "$KASUMI_RELEASE_REF_TYPE" \
            --ref-name "$KASUMI_RELEASE_REF_NAME"

      - name: Release Gate - Verify Native Linux Installers
        run: |
          VERSION="${KASUMI_VERSION}"
          sha256sum -c "kasumi-v${VERSION}-linux-x86_64.deb.sha256" "kasumi-v${VERSION}-linux-x86_64.rpm.sha256" "kasumi-v${VERSION}-linux-x86_64.pkg.tar.zst.sha256"

          dpkg-deb --info "kasumi-v${VERSION}-linux-x86_64.deb"
          sudo dpkg -i "kasumi-v${VERSION}-linux-x86_64.deb"
          test "$(/usr/bin/kasumi --version)" = "kasumi version $VERSION"
          test -f /usr/share/doc/kasumi/LICENSE
          test -f /usr/share/doc/kasumi/THIRD_PARTY_NOTICES.md
          sudo dpkg -i "kasumi-v${VERSION}-linux-x86_64.deb"
          test "$(/usr/bin/kasumi --version)" = "kasumi version $VERSION"
          sudo dpkg -r kasumi
          test ! -e /usr/bin/kasumi

          docker run --rm -v "$PWD:/work:ro" archlinux:latest bash -euo pipefail -c "
            pacman -U --noconfirm \"/work/kasumi-v${VERSION}-linux-x86_64.pkg.tar.zst\"
            test \"\$(/usr/bin/kasumi --version)\" = \"kasumi version $VERSION\"
            test -f /usr/share/licenses/kasumi/LICENSE
            test -f /usr/share/licenses/kasumi/THIRD_PARTY_NOTICES.md
            pacman -Qk kasumi
            pacman -U --noconfirm \"/work/kasumi-v${VERSION}-linux-x86_64.pkg.tar.zst\"
            test \"\$(/usr/bin/kasumi --version)\" = \"kasumi version $VERSION\"
            pacman -R --noconfirm kasumi
            test ! -e /usr/bin/kasumi
          "

          docker run --rm -v "$PWD:/work:ro" fedora:latest bash -euo pipefail -c "
            rpm --version
            rpm -qpi --nosignature \"/work/kasumi-v${VERSION}-linux-x86_64.rpm\"
            rpm -Uvh --nosignature \"/work/kasumi-v${VERSION}-linux-x86_64.rpm\"
            test \"\$(/usr/bin/kasumi --version)\" = \"kasumi version $VERSION\"
            test -f /usr/share/doc/kasumi/LICENSE
            test -f /usr/share/doc/kasumi/THIRD_PARTY_NOTICES.md
            rpm -V --nosignature kasumi
            rpm -Uvh --nosignature --replacepkgs \"/work/kasumi-v${VERSION}-linux-x86_64.rpm\"
            test \"\$(/usr/bin/kasumi --version)\" = \"kasumi version $VERSION\"
            rpm -e kasumi
            test ! -e /usr/bin/kasumi
          "

      - name: Upload Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kasumi-linux-x86_64
          path: |
            kasumi-v${{ env.KASUMI_VERSION }}-linux-x86_64.tar.gz
            kasumi-v${{ env.KASUMI_VERSION }}-linux-x86_64.tar.gz.sha256
            kasumi-v${{ env.KASUMI_VERSION }}-linux-x86_64.deb
            kasumi-v${{ env.KASUMI_VERSION }}-linux-x86_64.deb.sha256
            kasumi-v${{ env.KASUMI_VERSION }}-linux-x86_64.rpm
            kasumi-v${{ env.KASUMI_VERSION }}-linux-x86_64.rpm.sha256
            kasumi-v${{ env.KASUMI_VERSION }}-linux-x86_64.pkg.tar.zst
            kasumi-v${{ env.KASUMI_VERSION }}-linux-x86_64.pkg.tar.zst.sha256

  build-windows:
    name: Windows (x86_64)
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache FetchContent sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\kasumi-fc-cache
          key: fetchcontent-windows-${{ hashFiles('CMakeLists.txt') }}

      - name: Cache ccache (Release MSVC)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\ccache-windows-msvc-release
          key: ccache-windows-msvc-release-${{ github.sha }}
          restore-keys: |
            ccache-windows-msvc-release-
            ccache-windows-msvc-

      - name: Install ccache
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command ccache -CommandType Application -ErrorAction SilentlyContinue)) {
            $zip = Join-Path $env:RUNNER_TEMP 'ccache-4.14.3-windows-x86_64.zip'
            $url = 'https://github.com/ccache/ccache/releases/download/v4.14.3/ccache-4.14.3-windows-x86_64.zip'
            $expected = 'c845c3d65be81954c75659145a522a793a27586bf940c5dcfe18af33fa1a67dd'
            Invoke-WebRequest -Uri $url -OutFile $zip
            $actual = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expected) {
              throw "ccache SHA-256 mismatch: expected $expected, got $actual"
            }
            $extractDir = Join-Path $env:RUNNER_TEMP 'ccache-dist'
            Expand-Archive -Path $zip -DestinationPath $extractDir -Force
            $ccacheDir = (Get-ChildItem -Path $extractDir -Filter 'ccache.exe' -Recurse | Select-Object -First 1).Directory.FullName
            $ccacheDir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }

      - name: Build Web UI
        shell: powershell
        run: |
          Push-Location web
          try {
            npm ci
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            npm test
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            npm run build
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }

      - name: Build (Release MSVC)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          & (Join-Path $vsPath "Common7\Tools\Launch-VsDevShell.ps1") -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          $vsCmakeDir = Join-Path $vsPath "Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin"
          $vsNinjaDir = Join-Path $vsPath "Common7\IDE\CommonExtensions\Microsoft\CMake\Ninja"
          if (Test-Path $vsCmakeDir) { $env:PATH = "$vsCmakeDir;$vsNinjaDir;$env:PATH" }
          $fcCache = ($env:RUNNER_TEMP -replace '\\', '/') + '/kasumi-fc-cache'
          $env:CCACHE_DIR = ($env:RUNNER_TEMP -replace '\\', '/') + '/ccache-windows-msvc-release'
          $env:CCACHE_BASEDIR = ($env:GITHUB_WORKSPACE -replace '\\', '/')
          $env:CCACHE_NOHASHDIR = '1'
          $env:CCACHE_MAXSIZE = '2G'
          cmake -S . -B build-release -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=cl `
            -DCMAKE_CXX_COMPILER=cl `
            -DCMAKE_C_COMPILER_LAUNCHER=ccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache `
            "-DKASUMI_FETCHCONTENT_CACHE_DIR=$fcCache" `
            -DKASUMI_ENABLE_IPO=ON `
            -DBUILD_TESTING=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake -S . -B build-release-tests -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=cl `
            -DCMAKE_CXX_COMPILER=cl `
            -DCMAKE_C_COMPILER_LAUNCHER=ccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache `
            "-DKASUMI_FETCHCONTENT_CACHE_DIR=$fcCache" `
            -DKASUMI_ENABLE_IPO=OFF `
            -DBUILD_TESTING=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-release-tests --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ccache -s

      - name: Release Gate - Critical Tests
        shell: powershell
        run: |
          ctest --test-dir build-release-tests -L release-critical --output-on-failure --no-tests=error --parallel $env:NUMBER_OF_PROCESSORS

      - name: Release Gate - Smoke Test (Binary)
        shell: powershell
        run: |
          $exe = ".\build-release\kasumi.exe"
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "Binary smoke test --version failed with code $LASTEXITCODE" }
          & $exe --help
          if ($LASTEXITCODE -ne 0) { throw "Binary smoke test --help failed with code $LASTEXITCODE" }

      - name: Release Gate - Verify Runtime Dependencies (Static MSVC)
        shell: powershell
        run: |
          $exe = ".\build-release\kasumi.exe"
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
              throw "Release executable not found: $exe"
          }
          if (-not (Get-Command dumpbin -CommandType Application -ErrorAction SilentlyContinue)) {
              $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
              if (Test-Path $vswhere) {
                  $vsPath = & $vswhere -latest -property installationPath
                  $devShell = Join-Path $vsPath "Common7\Tools\Launch-VsDevShell.ps1"
                  if (Test-Path $devShell) {
                      & $devShell -Arch amd64
                  }
              }
          }
          $dumpbin = Get-Command dumpbin -CommandType Application -ErrorAction SilentlyContinue
          if (-not $dumpbin) {
              throw "dumpbin was not found; cannot verify Windows runtime dependencies."
          }
          $deps = & $dumpbin.Source /DEPENDENTS $exe 2>&1
          $dumpbinExitCode = $LASTEXITCODE
          if ($dumpbinExitCode -ne 0) {
              throw "dumpbin /DEPENDENTS failed with exit code $dumpbinExitCode."
          }
          $depsText = $deps | Out-String
          Write-Host "--- DLL Dependencies for $exe ---"
          $depsText | Write-Host
          if ([string]::IsNullOrWhiteSpace($depsText) -or
              $depsText -notmatch '(?im)^[ \t]*Image has the following dependencies:?[ \t]*\r?$' -or
              $depsText -notmatch '(?im)^[ \t]*[A-Za-z0-9_.-]+\.dll[ \t]*\r?$') {
              throw "dumpbin returned an empty or invalid dependency report."
          }
          $prohibited = @("VCRUNTIME", "MSVCP", "utf8proc", "sqlite3", "monocypher", "blake3", "reproc")
          foreach ($pattern in $prohibited) {
              $match = $depsText | Select-String -Pattern $pattern
              if ($match) {
                  throw "ERROR: Prohibited dependency detected in Windows Release binary: $pattern"
              }
          }

      - name: Install WiX Toolset
        shell: powershell
        run: |
          dotnet tool install --global wix --version 5.0.2
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          wix --version
          wix extension add -g WixToolset.UI.wixext/5.0.2
          if ($LASTEXITCODE -ne 0) { throw "Failed to add WixToolset.UI.wixext" }

      - name: Package
        shell: powershell
        run: |
          $cmakeText = Get-Content -LiteralPath CMakeLists.txt -Raw
          if ($cmakeText -notmatch '(?im)^\s*project\(kasumi\s+VERSION\s+([0-9]+\.[0-9]+\.[0-9]+)') {
              throw "Failed to parse version from CMakeLists.txt"
          }
          $version = $Matches[1]
          "KASUMI_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          $zipName = "kasumi-v$version-windows-x86_64.zip"
          $msiName = "kasumi-v$version-windows-x86_64.msi"

          New-Item -ItemType Directory -Path package
          Copy-Item build-release/kasumi.exe package/
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md package/
          Compress-Archive -Path package/* -DestinationPath $zipName
          $hash = (Get-FileHash $zipName -Algorithm SHA256).Hash.ToLower()
          "$hash *$zipName" | Out-File -FilePath "$zipName.sha256" -Encoding ascii

          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          wix build packaging/wix/kasumi.wxs `
            -arch x64 `
            -ext WixToolset.UI.wixext/5.0.2 `
            -loc packaging/wix/KasumiStrings.wxl `
            -d "ProductVersion=$version" `
            -d "BinPath=build-release/kasumi.exe" `
            -d "LicensePath=LICENSE" `
            -d "NoticesPath=THIRD_PARTY_NOTICES.md" `
            -d "LicenseRtf=packaging/wix/LICENSE.rtf" `
            -o $msiName
          if ($LASTEXITCODE -ne 0) { throw "wix build failed with code $LASTEXITCODE" }
          $msiHash = (Get-FileHash $msiName -Algorithm SHA256).Hash.ToLower()
          "$msiHash *$msiName" | Out-File -FilePath "$msiName.sha256" -Encoding ascii

      - name: Release Gate - Verify Package
        shell: powershell
        env:
          KASUMI_RELEASE_EVENT: ${{ github.event_name }}
          KASUMI_RELEASE_REF_TYPE: ${{ github.ref_type }}
          KASUMI_RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          $zipName = "kasumi-v$($env:KASUMI_VERSION)-windows-x86_64.zip"
          python scripts/verify_release_package.py `
            --archive $zipName `
            --checksum "$zipName.sha256" `
            --event-name $env:KASUMI_RELEASE_EVENT `
            --ref-type $env:KASUMI_RELEASE_REF_TYPE `
            --ref-name $env:KASUMI_RELEASE_REF_NAME
          if ($LASTEXITCODE -ne 0) { throw "Release package verification failed with code $LASTEXITCODE" }

      - name: Release Gate - Verify Windows MSI Installer
        shell: powershell
        run: |
          $version = $env:KASUMI_VERSION
          $msiName = "kasumi-v$version-windows-x86_64.msi"

          $expectedMsiHash = ((Get-Content -LiteralPath "$msiName.sha256" -Raw).Trim() -split '\s+')[0].ToLower()
          $actualMsiHash = (Get-FileHash -LiteralPath $msiName -Algorithm SHA256).Hash.ToLower()
          if ($actualMsiHash -ne $expectedMsiHash) {
              throw "MSI SHA-256 mismatch: expected $expectedMsiHash, got $actualMsiHash"
          }

          $installDir = "C:\Program Files\Kasumi"
          $msiPath = (Resolve-Path -LiteralPath $msiName).Path

          function Get-MachinePathEntries {
              $raw = [Environment]::GetEnvironmentVariable("Path", "Machine")
              if ([string]::IsNullOrWhiteSpace($raw)) { return @() }
              return @($raw.Split(';', [System.StringSplitOptions]::RemoveEmptyEntries) | ForEach-Object { $_.Trim().TrimEnd('\') })
          }

          function Invoke-MsiExec([string[]]$MsiArgs, [string]$LogPath) {
              $proc = Start-Process -FilePath msiexec.exe -ArgumentList ($MsiArgs + @("/l*v", $LogPath)) -Wait -PassThru
              if ($proc.ExitCode -ne 0) {
                  if (Test-Path -LiteralPath $LogPath) {
                      Get-Content -LiteralPath $LogPath -Tail 80 | Write-Host
                  }
                  throw "msiexec failed with exit code $($proc.ExitCode)"
              }
          }

          Invoke-MsiExec @("/i", $msiPath, "/qn") "$PWD\msi-install.log"
          foreach ($f in @("kasumi.exe", "LICENSE", "THIRD_PARTY_NOTICES.md")) {
              if (-not (Test-Path -LiteralPath (Join-Path $installDir $f) -PathType Leaf)) {
                  throw "Missing installed file: $f"
              }
          }
          $installedVer = (Get-ItemPropertyValue -Path "HKLM:\Software\auanK\Kasumi" -Name "InstalledVersion")
          if ($installedVer -ne $version) {
              throw "Registry InstalledVersion expected '$version', got '$installedVer'"
          }
          $pathHits = @(Get-MachinePathEntries | Where-Object { $_ -ieq $installDir })
          if ($pathHits.Count -ne 1) {
              throw "Expected $installDir once in Machine PATH after install, found $($pathHits.Count)"
          }
          $env:Path = [Environment]::GetEnvironmentVariable("Path", "Machine") + ";" + [Environment]::GetEnvironmentVariable("Path", "User")
          $resolvedExe = (Get-Command kasumi.exe -ErrorAction Stop).Source
          if ($resolvedExe -notlike "$installDir\*") {
              throw "kasumi.exe resolved to unexpected path: $resolvedExe"
          }
          $outVersion = (& kasumi.exe --version).Trim()
          if ($outVersion -ne "kasumi version $version") {
              throw "Installed kasumi --version returned '$outVersion', expected 'kasumi version $version'"
          }

          Invoke-MsiExec @("/i", $msiPath, "/qn") "$PWD\msi-upgrade.log"
          $pathHitsAfterUpgrade = @(Get-MachinePathEntries | Where-Object { $_ -ieq $installDir })
          if ($pathHitsAfterUpgrade.Count -ne 1) {
              throw "Expected $installDir once in Machine PATH after upgrade, found $($pathHitsAfterUpgrade.Count)"
          }
          $outVersionUpgrade = (& (Join-Path $installDir "kasumi.exe") --version).Trim()
          if ($outVersionUpgrade -ne "kasumi version $version") {
              throw "Upgraded kasumi --version returned '$outVersionUpgrade'"
          }

          Invoke-MsiExec @("/x", $msiPath, "/qn") "$PWD\msi-uninstall.log"
          if (Test-Path -LiteralPath (Join-Path $installDir "kasumi.exe")) {
              throw "kasumi.exe still present after MSI uninstall"
          }
          $pathHitsAfterUninstall = @(Get-MachinePathEntries | Where-Object { $_ -ieq $installDir })
          if ($pathHitsAfterUninstall.Count -ne 0) {
              throw "Expected $installDir removed from Machine PATH after uninstall, found $($pathHitsAfterUninstall.Count)"
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kasumi-windows-x86_64
          path: |
            kasumi-v${{ env.KASUMI_VERSION }}-windows-x86_64.zip
            kasumi-v${{ env.KASUMI_VERSION }}-windows-x86_64.zip.sha256
            kasumi-v${{ env.KASUMI_VERSION }}-windows-x86_64.msi
            kasumi-v${{ env.KASUMI_VERSION }}-windows-x86_64.msi.sha256

  publish:
    name: Publish Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout release metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Release metadata
        run: |
          test -f RELEASE_NOTES.md
          test -s RELEASE_NOTES.md
          VERSION="$(python3 -c 'import re; print(re.search(r"project\(kasumi\s+VERSION\s+([0-9]+\.[0-9]+\.[0-9]+)", open("CMakeLists.txt").read()).group(1))')"
          echo "KASUMI_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Validate and consolidate SHA-256 checksums
        run: |
          VERSION="${KASUMI_VERSION}"
          cd dist
          sha256sum -c "kasumi-v${VERSION}-linux-x86_64.tar.gz.sha256"
          sha256sum -c "kasumi-v${VERSION}-linux-x86_64.deb.sha256"
          sha256sum -c "kasumi-v${VERSION}-linux-x86_64.rpm.sha256"
          sha256sum -c "kasumi-v${VERSION}-linux-x86_64.pkg.tar.zst.sha256"
          sha256sum -c "kasumi-v${VERSION}-windows-x86_64.zip.sha256"
          sha256sum -c "kasumi-v${VERSION}-windows-x86_64.msi.sha256"
          cat \
            "kasumi-v${VERSION}-linux-x86_64.tar.gz.sha256" \
            "kasumi-v${VERSION}-linux-x86_64.deb.sha256" \
            "kasumi-v${VERSION}-linux-x86_64.rpm.sha256" \
            "kasumi-v${VERSION}-linux-x86_64.pkg.tar.zst.sha256" \
            "kasumi-v${VERSION}-windows-x86_64.zip.sha256" \
            "kasumi-v${VERSION}-windows-x86_64.msi.sha256" > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          ls -la

      - name: Generate Artifact Attestations (Build Provenance)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/kasumi-v${{ env.KASUMI_VERSION }}-linux-x86_64.tar.gz
            dist/kasumi-v${{ env.KASUMI_VERSION }}-linux-x86_64.deb
            dist/kasumi-v${{ env.KASUMI_VERSION }}-linux-x86_64.rpm
            dist/kasumi-v${{ env.KASUMI_VERSION }}-linux-x86_64.pkg.tar.zst
            dist/kasumi-v${{ env.KASUMI_VERSION }}-windows-x86_64.zip
            dist/kasumi-v${{ env.KASUMI_VERSION }}-windows-x86_64.msi
            dist/SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/kasumi-v${{ env.KASUMI_VERSION }}-linux-x86_64.tar.gz
            dist/kasumi-v${{ env.KASUMI_VERSION }}-linux-x86_64.tar.gz.sha256
            dist/kasumi-v${{ env.KASUMI_VERSION }}-linux-x86_64.deb
            dist/kasumi-v${{ env.KASUMI_VERSION }}-linux-x86_64.deb.sha256
            dist/kasumi-v${{ env.KASUMI_VERSION }}-linux-x86_64.rpm
            dist/kasumi-v${{ env.KASUMI_VERSION }}-linux-x86_64.rpm.sha256
            dist/kasumi-v${{ env.KASUMI_VERSION }}-linux-x86_64.pkg.tar.zst
            dist/kasumi-v${{ env.KASUMI_VERSION }}-linux-x86_64.pkg.tar.zst.sha256
            dist/kasumi-v${{ env.KASUMI_VERSION }}-windows-x86_64.zip
            dist/kasumi-v${{ env.KASUMI_VERSION }}-windows-x86_64.zip.sha256
            dist/kasumi-v${{ env.KASUMI_VERSION }}-windows-x86_64.msi
            dist/kasumi-v${{ env.KASUMI_VERSION }}-windows-x86_64.msi.sha256
            dist/SHA256SUMS.txt
          body_path: RELEASE_NOTES.md
          prerelease: ${{ contains(github.ref_name, '-') }}
